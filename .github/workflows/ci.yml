name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build @repo/dto
        run: pnpm dto

      - name: Lint
        run: pnpm lint

      - name: Check types
        run: pnpm check-types

      - name: Test
        run: pnpm test

      # 서버/클라이언트 컴포넌트 경계 오류는 lint·tsc·jest로 잡히지 않아 프로덕션 빌드로 확인한다
      - name: Build web
        run: pnpm --filter web build
